<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f8ff" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" href="data:," />
  <title>Musi · Cazador de melodías</title>

  <!-- Performance: CDN -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

  <style>
    :root{
      --bg: #f6f8ff;
      --card: rgba(255,255,255,.86);
      --card2: rgba(255,255,255,.94);
      --line: rgba(11,16,32,.10);
      --text: #0b1020;
      --muted: rgba(11,16,32,.65);

      --mozart: #0C41C4;
      --beethoven: #680DBF;
      --brahms: #CE0071;

      --r: 18px;
      --shadow: 0 18px 60px rgba(12,65,196,.12);
      --maxw: 1100px;
      --focus: rgba(12,65,196,.35);
    }

    *{ box-sizing: border-box; }
    html, body{ height: 100%; }

    body{
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color: var(--text);
      background:
        radial-gradient(1200px 900px at 20% 10%, rgba(12,65,196,.14), transparent 60%),
        radial-gradient(900px 700px at 80% 30%, rgba(104,13,191,.12), transparent 55%),
        radial-gradient(900px 700px at 70% 90%, rgba(206,0,113,.10), transparent 55%),
        var(--bg);
      overflow: hidden;
    }

    /* Layout */
    .shell{
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
    }

    .wrap{
      width: min(100%, 800px, calc((100dvh - 32px) * 4 / 3));
      display: grid;
      gap: 12px;
      place-items: center;
    }

    .frame{
      width: 100%;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      /* mejora percepción de nitidez al escalar */
      transform: translateZ(0);
    }

    /* Mantiene relación de aspecto agradable antes de que Phaser ajuste */
    .stage{
      width: 100%;
      aspect-ratio: 4 / 3;
      display: grid;
      place-items: center;
      /* clave: el root debe tener alto real para que Phaser no calcule raro por timing */
      height: auto;
    }

    /* Root explícito (Phaser mete el canvas aquí) */
    #phaser-root{
      width: 100%;
      height: auto;
    }

    /* Phaser pone el canvas, nosotros lo hacemos responsive */
    canvas{
      display: block;
      max-width: 100%;
      
      outline: none;
      touch-action: none; /* importante para móvil */
    }

    /* Focus visible (teclado) */
    canvas:focus-visible{
      box-shadow: 0 0 0 4px var(--focus);
      border-radius: 12px;
    }

    /* Loading overlay */
    .loading{
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.65));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
    }
    .loading.hidden{
      opacity: 0;
      transform: translateY(-6px);
    }

    .loading .box{
      display: grid;
      gap: 10px;
      justify-items: center;
      padding: 16px 18px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.75);
      box-shadow: 0 10px 28px rgba(11,16,32,.08);
    }

    .spinner{
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 3px solid rgba(11,16,32,.14);
      border-top-color: rgba(11,16,32,.45);
      animation: spin 1s linear infinite;
    }
    @keyframes spin{ to{ transform: rotate(360deg);} }

    .hint{
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      max-width: 40ch;
      line-height: 1.35;
    }

    /* Accesibilidad */
    .sr-only{
      position:absolute; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce){
      .loading{ transition: none; }
      .spinner{ animation: none; }
    }
  </style>
  <link rel="stylesheet" href="./responsive.css" />
</head>

<body>
  <main class="shell">
    <div class="wrap">
      <h1 class="sr-only">Musi · Cazador de melodías</h1>

      <section class="frame" aria-label="Juego">
        <div id="phaser-root" class="stage"></div>
        <div id="ui-root"></div>

        <div id="loading" class="loading" aria-live="polite">
          <div class="box">
            <div class="spinner" aria-hidden="true"></div>
            <div class="hint">Preparando tu aventura musical…</div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Phaser (global) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>

  <!-- App bootstrap (módulo). game.js se encarga de importar config/scenes/etc. -->
  <script type="module">
    const loading = document.getElementById("loading");

    // Quita overlay cuando la primera escena dispare el evento.
    window.addEventListener("musi:ready", () => loading.classList.add("hidden"), { once:true });

    // Importa el bootstrap real (estructura de archivos)
    import "./game.js";

    // “Nudge” de layout: algunos navegadores necesitan 1-2 frames para estabilizar el aspect-ratio.
    // Esto no rompe nada si no lo usas; si en game.js escuchas 'musi:resize' puedes hacer scale.refresh().
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        window.dispatchEvent(new Event("musi:resize"));
      });
    });

    // Fallback: si por cualquier razón nunca llegó el 'musi:ready', no dejes al usuario en limbo eterno.
    setTimeout(() => {
      if (!loading.classList.contains("hidden")) loading.querySelector(".hint").textContent = "La carga está tardando. Comprueba tu conexión y recarga si no avanza.";
    }, 20000);
  </script>

  <noscript>
    <p style="padding:16px; text-align:center;">Necesitas JavaScript para jugar.</p>
  </noscript>
</body>
</html>
